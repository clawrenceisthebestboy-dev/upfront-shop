# Build the Windows installer on every tag that looks like a release
# (e.g. v1.6.0) and attach it to a GitHub Release.
#
# After a successful run the installer is available in two places:
#   - The Actions artifact (for ad-hoc QA pulls)
#   - The GitHub Release asset list (what shops download via the updater)
#
# Signing the update manifest is deliberately NOT in this workflow —
# the Ed25519 release key lives offline on Josh's Mac per the design
# in app/updater.py. After this workflow finishes:
#   1. Download the installer from the Release page on the Mac.
#   2. Compute its sha256 and author an unsigned latest.json.
#   3. Run tools/sign_manifest.py to sign it.
#   4. Upload the .exe and the signed latest.json to the webhost.

name: windows-build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:    # manual run from the Actions tab for ad-hoc builds

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive version from tag (or commit SHA for manual runs)
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $ver = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Building version $ver"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.9.0

      - name: Install Inno Setup
        shell: pwsh
        # Inno Setup 6 comes pre-installed on windows-latest runners under
        # C:\Program Files (x86)\Inno Setup 6\. If that ever changes, the
        # choco fallback makes this resilient.
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe still not found after install."
            exit 1
          }

      - name: PyInstaller build
        shell: pwsh
        run: |
          if (Test-Path dist\UpFrontShop) { Remove-Item -Recurse -Force dist\UpFrontShop }
          pyinstaller --clean --noconfirm build\upfront.spec

      - name: Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc build\installer.iss

      - name: Rename installer with version
        id: rename
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $src = "dist\UpFrontShopSetup.exe"
          $dst = "dist\UpFrontShopSetup-$ver.exe"
          Move-Item $src $dst
          echo "installer=$dst" >> $env:GITHUB_OUTPUT
          # SHA256 is what goes into latest.json (the signed manifest).
          # Print it here so Josh can grab it straight out of the log.
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $dst"
          Write-Host "SHA256:    $hash"

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpFrontShopSetup-${{ steps.version.outputs.version }}
          path: ${{ steps.rename.outputs.installer }}
          if-no-files-found: error

      - name: Create GitHub Release and attach installer
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Up Front Shop ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ### Up Front Shop ${{ steps.version.outputs.version }}

            Windows installer attached below.

            **SHA-256 of `UpFrontShopSetup-${{ steps.version.outputs.version }}.exe`:**
            ```
            ${{ steps.rename.outputs.sha256 }}
            ```

            Use this hash when authoring `latest.json` for the auto-updater.
          files: ${{ steps.rename.outputs.installer }}
