name: Build Windows Installer

# When this runs:
#   - Every push to main (so you always have a fresh installer to download)
#   - Every pull request (catches build breakage early)
#   - Every tag starting with "v" (e.g. v1.4.0) — also publishes a GitHub Release
#   - Manually from the Actions tab (workflow_dispatch)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Python dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.9.0 pytest

      - name: Run unit tests
        shell: cmd
        run: |
          python -m pytest tests/ -v

      - name: Build portable app with PyInstaller
        shell: cmd
        run: |
          pyinstaller --clean --noconfirm build\upfront.spec

      - name: Install Inno Setup 6
        shell: cmd
        run: |
          choco install innosetup --version=6.2.2 -y --no-progress

      - name: Compile installer with Inno Setup
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" build\installer.iss

      - name: Verify installer exists
        shell: cmd
        run: |
          if not exist dist\UpFrontShopSetup.exe (
              echo ERROR: UpFrontShopSetup.exe was not produced.
              exit /b 1
          )
          dir dist\UpFrontShopSetup.exe

      - name: Compute SHA-256 of installer
        shell: cmd
        run: |
          certutil -hashfile dist\UpFrontShopSetup.exe SHA256 > dist\UpFrontShopSetup.exe.sha256.txt
          type dist\UpFrontShopSetup.exe.sha256.txt

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpFrontShopSetup
          path: |
            dist/UpFrontShopSetup.exe
            dist/UpFrontShopSetup.exe.sha256.txt
          retention-days: 90

      - name: Publish GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UpFrontShopSetup.exe
            dist/UpFrontShopSetup.exe.sha256.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
